name: One-time Setup API migration

on:
  push:
    branches:
      - agent/idreamofeasy-26-2-legacy

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/idreamofeasy-26-2-legacy
          fetch-depth: 0

      - name: Modernize Setup.java API calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/me/bunnky/idreamofeasy/slimefun/setup/Setup.java')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace('CustomItemStack.create(', 'new CustomItemStack(')
          text = text.replace('Material.CHAIN', 'Material.IRON_CHAIN')
          text = text.replace('.item()', '')

          if text == original:
              print('Setup.java already modernized; no commit required.')
              raise SystemExit(0)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/main/java/me/bunnky/idreamofeasy/slimefun/setup/Setup.java; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/me/bunnky/idreamofeasy/slimefun/setup/Setup.java
          git commit -m 'Modernize Setup registry for Slimefun Legacy API'
          git push origin HEAD:agent/idreamofeasy-26-2-legacy
