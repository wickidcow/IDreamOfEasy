name: Build IDreamOfEasy 26.2 / Slimefun Legacy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sf-idreamofeasy-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IDreamOfEasy
        uses: actions/checkout@v5
        with:
          path: idreamofeasy
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify Legacy fork source policy
        working-directory: idreamofeasy
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number -E 'net\.guizhanss|GuizhanLibPlugin|GuizhanUpdater|鬼斩' pom.xml src/main/java src/main/resources; then
            echo 'GuizhanLib or Gugu-only runtime code is still present.'
            exit 1
          fi
          grep -q '^folia-supported: true$' src/main/resources/plugin.yml
      - name: Install latest Slimefun Legacy release into Maven local
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEP_DIR="$RUNNER_TEMP/slimefun-legacy"
          mkdir -p "$DEP_DIR"
          TAG="$(gh api repos/wickidcow/Slimefun-Legacy/releases/latest --jq '.tag_name')"
          ASSET_NAME="$(gh api repos/wickidcow/Slimefun-Legacy/releases/latest --jq '.assets[] | select(.name | endswith(".jar")) | .name' | head -n 1)"
          test -n "$TAG"
          test -n "$ASSET_NAME"
          gh release download "$TAG" --repo wickidcow/Slimefun-Legacy --pattern "$ASSET_NAME" --dir "$DEP_DIR"
          test -s "$DEP_DIR/$ASSET_NAME"
          mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="$DEP_DIR/$ASSET_NAME" -DgroupId=com.github.slimefun -DartifactId=Slimefun -Dversion=Legacy-SNAPSHOT -Dpackaging=jar -DgeneratePom=true
      - name: Build IDreamOfEasy
        working-directory: idreamofeasy
        run: mvn -B clean package -Dmaven.compiler.showDeprecation=true
      - name: Stage versioned JAR
        id: output
        working-directory: idreamofeasy
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          SOURCE="target/SF_IDreamOfEasy_Legacy_v${VERSION}.jar"
          NAME="SF_IDreamOfEasy${VERSION}.jar"
          OUTPUT="dist/${NAME}"
          test -s "$SOURCE"
          mkdir -p dist
          cp "$SOURCE" "$OUTPUT"
          jar tf "$OUTPUT" >/dev/null
          if jar tf "$OUTPUT" | grep -qi 'guizhan'; then exit 1; fi
          PLUGIN_YML="$(unzip -p "$OUTPUT" plugin.yml)"
          grep -q "^version: ${VERSION}$" <<< "$PLUGIN_YML"
          grep -q '^folia-supported: true$' <<< "$PLUGIN_YML"
          sha256sum "$OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: idreamofeasy/${{ steps.output.outputs.jar }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        working-directory: idreamofeasy
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.output.outputs.version }}
          JAR: ${{ steps.output.outputs.jar }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VERSION}"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" "$JAR" --clobber; else gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --generate-notes --title "SF_IDreamOfEasy $TAG"; fi
