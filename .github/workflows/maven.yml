name: Build IDreamOfEasy 26.2 / Slimefun Legacy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sf-idreamofeasy-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout IDreamOfEasy
        uses: actions/checkout@v5
        with:
          path: idreamofeasy

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Legacy fork source policy
        working-directory: idreamofeasy
        shell: bash
        run: |
          set -euo pipefail

          if grep -R --line-number -E 'net\.guizhanss|GuizhanLibPlugin|GuizhanUpdater|鬼斩' pom.xml src/main/java src/main/resources; then
            echo 'GuizhanLib or Gugu-only runtime code is still present.'
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          cjk_files = []
          legacy_patterns = {
              r'org\.bukkit\.scheduler\.BukkitRunnable': 'BukkitRunnable',
              r'org\.bukkit\.scheduler\.BukkitTask': 'BukkitTask',
              r'Bukkit\.getScheduler\s*\(': 'Bukkit global scheduler',
              r'getServer\(\)\.getScheduler\s*\(': 'server Bukkit scheduler',
              r'scheduleSyncDelayedTask\s*\(': 'legacy delayed scheduler',
              r'\.runTaskTimer\s*\(': 'Bukkit runTaskTimer',
              r'\.runTaskLater\s*\(': 'Bukkit runTaskLater',
              r'AsyncPlayerChatEvent': 'deprecated legacy chat event',
              r'me\.mrCookieSlime\.Slimefun\.api\.BlockStorage': 'legacy BlockStorage facade',
              r'FixedMetadataValue': 'legacy Bukkit metadata marker',
              r'CSCoreLibPlugin\.Configuration\.Config': 'legacy ticker Config',
              r'\.getDurability\s*\(': 'legacy item durability API',
              r'\.setDurability\s*\(': 'legacy item durability API',
          }
          allowed_deprecation_suppression = {
              'src/main/java/me/bunnky/idreamofeasy/slimefun/machines/ElectricCable.java',
              'src/main/java/me/bunnky/idreamofeasy/slimefun/machines/ElectricShearer.java',
              'src/main/java/me/bunnky/idreamofeasy/slimefun/machines/PlayerHopper.java',
              'src/main/java/me/bunnky/idreamofeasy/slimefun/machines/RadiationAbsorber.java',
              'src/main/java/me/bunnky/idreamofeasy/slimefun/machines/SupplyHopper.java',
              'src/main/java/me/bunnky/idreamofeasy/slimefun/machines/repellers/MobRepeller.java',
          }
          violations = []

          for root in (Path('src/main/java'), Path('src/main/resources')):
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  text = path.read_text(encoding='utf-8', errors='ignore')
                  path_name = str(path)

                  if any('\u3400' <= ch <= '\u9fff' for ch in text):
                      cjk_files.append(path_name)

                  if path.suffix == '.java':
                      for pattern, label in legacy_patterns.items():
                          if re.search(pattern, text):
                              violations.append(f'{path}: {label}')

                      if 'SuppressWarnings' in text and 'deprecation' in text and path_name not in allowed_deprecation_suppression:
                          violations.append(f'{path}: unreviewed deprecation suppression')

          if cjk_files:
              raise SystemExit('CJK-localized runtime text remains in: ' + ', '.join(cjk_files))

          if violations:
              raise SystemExit('Legacy/Folia-hostile API use remains:\n' + '\n'.join(violations))

          plugin_yml = Path('src/main/resources/plugin.yml').read_text(encoding='utf-8')
          if not re.search(r'^folia-supported:\s*true\s*$', plugin_yml, re.MULTILINE):
              raise SystemExit('plugin.yml must explicitly declare folia-supported: true')
          PY

          echo 'Legacy/Folia source policy check passed.'

      - name: Install latest Slimefun Legacy release into Maven local
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          DEP_DIR="$RUNNER_TEMP/slimefun-legacy"
          mkdir -p "$DEP_DIR"

          TAG="$(gh api repos/wickidcow/Slimefun-Legacy/releases/latest --jq '.tag_name')"
          ASSET_NAME="$(gh api repos/wickidcow/Slimefun-Legacy/releases/latest --jq '.assets[] | select(.name | endswith(".jar")) | .name' | head -n 1)"

          if [ -z "$TAG" ] || [ -z "$ASSET_NAME" ]; then
            echo 'Could not resolve the latest Slimefun Legacy release JAR.'
            exit 1
          fi

          echo "Using Slimefun Legacy release ${TAG}: ${ASSET_NAME}"

          for attempt in 1 2 3; do
            rm -f "$DEP_DIR/$ASSET_NAME"
            if gh release download "$TAG" \
              --repo wickidcow/Slimefun-Legacy \
              --pattern "$ASSET_NAME" \
              --dir "$DEP_DIR"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo 'Slimefun Legacy release download failed after 3 attempts.'
              exit 1
            fi

            sleep $((attempt * 5))
          done

          test -s "$DEP_DIR/$ASSET_NAME"
          jar tf "$DEP_DIR/$ASSET_NAME" >/dev/null
          sha256sum "$DEP_DIR/$ASSET_NAME"

          mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$DEP_DIR/$ASSET_NAME" \
            -DgroupId=com.github.slimefun \
            -DartifactId=Slimefun \
            -Dversion=Legacy-SNAPSHOT \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Build IDreamOfEasy
        working-directory: idreamofeasy
        run: mvn -B clean package -Dmaven.compiler.showDeprecation=true

      - name: Stage and validate direct IDreamOfEasy JAR
        id: output
        working-directory: idreamofeasy
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          NAME="SF_IDreamOfEasy_Legacy_v${VERSION}.jar"
          SOURCE="target/${NAME}"
          OUTPUT="dist/${NAME}"

          test -f "$SOURCE"
          mkdir -p dist
          cp "$SOURCE" "$OUTPUT"
          test -s "$OUTPUT"
          jar tf "$OUTPUT" >/dev/null

          if jar tf "$OUTPUT" | grep -qi 'guizhan'; then
            echo 'Unexpected Guizhan classes found in final JAR.'
            exit 1
          fi

          if jar tf "$OUTPUT" | grep -q '^org/bstats/'; then
            echo 'Unrelocated bStats classes found in final JAR.'
            exit 1
          fi

          if ! jar tf "$OUTPUT" | grep -q '^me/bunnky/idreamofeasy/libs/bstats/'; then
            echo 'Relocated bStats classes are missing from final JAR.'
            exit 1
          fi

          PLUGIN_YML="$(unzip -p "$OUTPUT" plugin.yml)"
          grep -q "^version: ${VERSION}$" <<< "$PLUGIN_YML"
          grep -q '^folia-supported: true$' <<< "$PLUGIN_YML"
          grep -q '^  - Slimefun$' <<< "$PLUGIN_YML"

          sha256sum "$OUTPUT"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload direct JAR build output
        uses: actions/upload-artifact@v7
        with:
          path: idreamofeasy/${{ steps.output.outputs.jar }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct JAR release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        working-directory: idreamofeasy
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.output.outputs.version }}
          JAR: ${{ steps.output.outputs.jar }}
          NAME: ${{ steps.output.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          NOTES_FILE="release-notes/${TAG}.md"
          TITLE="IDreamOfEasy Legacy ${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE"
            fi
          elif [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" \
              --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "Paper 26.2 / Slimefun Legacy compatibility build. GuizhanLibPlugin is not required. The attached ${NAME} is the direct server JAR."
          fi
